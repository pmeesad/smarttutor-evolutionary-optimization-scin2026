[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smarttutor-full-revision-experiments"
version = "4.0.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.0", "scipy>=1.14", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
